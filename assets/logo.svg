<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cu2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B49"/>
      <stop offset="50%" stop-color="#004b7a"/>
      <stop offset="100%" stop-color="#00182b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B82E"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="100" fill="url(#cu2Grad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>
  
  <!-- Campus Map Pin / Bag Hybrid Symbol -->
  <circle cx="256" cy="180" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="14" filter="url(#glow)"/>
  
  <!-- Stylized Lobo / Tech Node Silhouette -->
  <path d="M190 270 L256 120 L322 270 L280 250 L256 295 L232 250 Z" fill="url(#goldGrad)"/>
  <circle cx="256" cy="200" r="18" fill="#002B49"/>
  <circle cx="210" cy="190" r="8" fill="url(#goldGrad)"/>
  <circle cx="302" cy="190" r="8" fill="url(#goldGrad)"/>

  <!-- Shopping Bag Basket Outline -->
  <path d="M150 280 L362 280 L336 410 C334 424, 322 434, 308 434 L204 434 C190 434, 178 424, 176 410 Z" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Location Compass Mark inside basket -->
  <path d="M236 340 L276 340 M256 320 L256 360" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Text Label -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="4">CAMPUSTRADE CU2</text>
</svg>
